name: Pulse backend upgrades

on:
  push:
    paths:
      - 'artifacts/chat-app/**'
      - '.github/workflows/pulse-backend-upgrades.yml'
      - 'cloudflare-worker/migrations/**'

permissions:
  contents: write

jobs:
  patch-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Cloudflare Worker
        shell: python
        run: |
          from pathlib import Path
          p = Path('cloudflare-worker/src/index.ts')
          s = p.read_text()

          # Keep the existing privacy patches, then add a real PeerJS address registry.
          old = 'function publicUser(row: any, online = false) { const seen = row.last_seen_at || row.updated_at || row.created_at; const fresh = Date.now() - new Date(seen).getTime() < 45000; return { id: Number(row.id), username: row.username, displayName: row.display_name || row.username, avatarUrl: row.avatar_url ?? null, bio: row.bio ?? null, isOnline: fresh, lastSeen: seen, createdAt: row.created_at, messageSearchOnly: !!row.message_search_only }; }'
          new = 'function publicUser(row: any, online = false) { const seen = row.last_seen_at || row.updated_at || row.created_at; const fresh = Date.now() - new Date(seen).getTime() < 45000; return { id: Number(row.id), username: row.username, displayName: row.display_name || row.username, avatarUrl: row.avatar_url ?? null, bio: row.bio ?? null, isOnline: fresh, lastSeen: seen, createdAt: row.created_at, messageSearchOnly: !!row.message_search_only, peerId: row.peer_id || null }; }'
          if old in s: s = s.replace(old, new)

          old = 'async function ensureExtraTables(env: Env) { const columns = await env.DB.prepare(`PRAGMA table_info(users)`).all<any>(); if (!columns.results.some((c: any) => c.name === "message_search_only")) await env.DB.prepare(`ALTER TABLE users ADD COLUMN message_search_only INTEGER NOT NULL DEFAULT 0`).run(); await env.DB.batch([env.DB.prepare(`CREATE TABLE IF NOT EXISTS message_reactions (message_id TEXT NOT NULL,user_id TEXT NOT NULL,emoji TEXT NOT NULL,PRIMARY KEY (message_id,user_id,emoji))`), env.DB.prepare(`CREATE TABLE IF NOT EXISTS typing_indicators (conversation_id TEXT NOT NULL,user_id TEXT NOT NULL,updated_at TEXT NOT NULL,PRIMARY KEY (conversation_id,user_id))`), env.DB.prepare(`CREATE TABLE IF NOT EXISTS message_search_grants (searcher_id TEXT NOT NULL,target_user_id TEXT NOT NULL,expires_at TEXT NOT NULL,PRIMARY KEY (searcher_id,target_user_id))`)]); }'
          new = 'async function ensureExtraTables(env: Env) { const columns = await env.DB.prepare(`PRAGMA table_info(users)`).all<any>(); if (!columns.results.some((c: any) => c.name === "message_search_only")) await env.DB.prepare(`ALTER TABLE users ADD COLUMN message_search_only INTEGER NOT NULL DEFAULT 0`).run(); if (!columns.results.some((c: any) => c.name === "peer_id")) await env.DB.prepare(`ALTER TABLE users ADD COLUMN peer_id TEXT`).run(); await env.DB.batch([env.DB.prepare(`CREATE TABLE IF NOT EXISTS message_reactions (message_id TEXT NOT NULL,user_id TEXT NOT NULL,emoji TEXT NOT NULL,PRIMARY KEY (message_id,user_id,emoji))`), env.DB.prepare(`CREATE TABLE IF NOT EXISTS typing_indicators (conversation_id TEXT NOT NULL,user_id TEXT NOT NULL,updated_at TEXT NOT NULL,PRIMARY KEY (conversation_id,user_id))`), env.DB.prepare(`CREATE TABLE IF NOT EXISTS message_search_grants (searcher_id TEXT NOT NULL,target_user_id TEXT NOT NULL,expires_at TEXT NOT NULL,PRIMARY KEY (searcher_id,target_user_id))`)]); }'
          if old in s: s = s.replace(old, new)

          # Searching an exact username grants message access.
          old = 'if (path === "/api/users" && request.method === "GET") { const search = (url.searchParams.get("search") || "").trim(); const rows = search ? await env.DB.prepare(`SELECT * FROM users WHERE (lower(username) LIKE lower(?) OR lower(display_name) LIKE lower(?)) ORDER BY username LIMIT 20`).bind(`%${search}%`, `%${search}%`).all<any>() : await env.DB.prepare(`SELECT * FROM users ORDER BY username LIMIT 30`).all<any>(); if (search) { const exact = await env.DB.prepare(`SELECT id FROM users WHERE lower(username) = lower(?) LIMIT 1`).bind(search).first<any>(); if (exact && String(exact.id) !== String(me.id)) await env.DB.prepare(`INSERT OR REPLACE INTO message_search_grants (searcher_id,target_user_id,expires_at) VALUES (?,?,?)`).bind(me.id, exact.id, new Date(Date.now() + 10 * 60 * 1000).toISOString()).run(); } return json(rows.results.map((u: any) => publicUser(u)), 200, request, env); }'
          if old not in s:
            old = 'if (path === "/api/users" && request.method === "GET") { const search = (url.searchParams.get("search") || "").trim(); const rows = search ? await env.DB.prepare(`SELECT * FROM users WHERE (lower(username) LIKE lower(?) OR lower(display_name) LIKE lower(?)) ORDER BY username LIMIT 20`).bind(`%${search}%`, `%${search}%`).all<any>() : await env.DB.prepare(`SELECT * FROM users ORDER BY username LIMIT 30`).all<any>(); return json(rows.results.map((u: any) => publicUser(u)), 200, request, env); }'
          if old in s:
            new = 'if (path === "/api/users" && request.method === "GET") { const search = (url.searchParams.get("search") || "").trim(); const rows = search ? await env.DB.prepare(`SELECT * FROM users WHERE (lower(username) LIKE lower(?) OR lower(display_name) LIKE lower(?)) ORDER BY username LIMIT 20`).bind(`%${search}%`, `%${search}%`).all<any>() : await env.DB.prepare(`SELECT * FROM users ORDER BY username LIMIT 30`).all<any>(); if (search) { const exact = await env.DB.prepare(`SELECT id FROM users WHERE lower(username) = lower(?) LIMIT 1`).bind(search).first<any>(); if (exact && String(exact.id) !== String(me.id)) await env.DB.prepare(`INSERT OR REPLACE INTO message_search_grants (searcher_id,target_user_id,expires_at) VALUES (?,?,?)`).bind(me.id, exact.id, new Date(Date.now() + 10 * 60 * 1000).toISOString()).run(); } return json(rows.results.map((u: any) => publicUser(u)), 200, request, env); }'
            s = s.replace(old, new)

          # Register and refresh the current browser's PeerJS address.
          marker = 'const readMatch = path.match(/^\\/api\\/conversations\\/([^/]+)\\/(?:read|mark-read)$/);'
          if marker in s and '/api/users/me/peer' not in s:
            addition = 'if (path === "/api/users/me/peer" && request.method === "PATCH") { const body = await parseBody(request); const peerId = body.peerId ? String(body.peerId).slice(0, 200) : null; await env.DB.prepare(`UPDATE users SET peer_id = ?, updated_at = ? WHERE id = ?`).bind(peerId, new Date().toISOString(), me.id).run(); const updated = await env.DB.prepare(`SELECT * FROM users WHERE id = ?`).bind(me.id).first<any>(); return json(publicUser(updated, true), 200, request, env); }\n      '
            s = s.replace(marker, addition + marker)

          # Ensure PATCH profile updates preserve the peer address.
          old = 'const messageSearchOnly = body.messageSearchOnly !== undefined ? (body.messageSearchOnly ? 1 : 0) : Number(me.message_search_only || 0);'
          new = 'const messageSearchOnly = body.messageSearchOnly !== undefined ? (body.messageSearchOnly ? 1 : 0) : Number(me.message_search_only || 0);'
          # no-op marker; endpoint above is intentionally separate so peer updates do not alter profile data.

          p.write_text(s)
      - name: Commit backend patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-worker/src/index.ts
          git diff --cached --quiet || git commit -m 'Register active PeerJS calling addresses'
          git push
