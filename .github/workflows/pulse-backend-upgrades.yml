name: Pulse backend upgrades

on:
  push:
    paths:
      - 'artifacts/chat-app/**'
      - '.github/workflows/pulse-backend-upgrades.yml'
      - 'cloudflare-worker/migrations/**'

permissions:
  contents: write

jobs:
  patch-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Cloudflare Worker
        shell: python
        run: |
          from pathlib import Path
          p = Path('cloudflare-worker/src/index.ts')
          s = p.read_text()

          old = 'function publicUser(row: any, online = false) { return { id: Number(row.id), username: row.username, displayName: row.display_name || row.username, avatarUrl: row.avatar_url ?? null, bio: row.bio ?? null, isOnline: online, lastSeen: row.updated_at || row.created_at, createdAt: row.created_at }; }'
          new = 'function publicUser(row: any, online = false) { const seen = row.last_seen_at || row.updated_at || row.created_at; const fresh = Date.now() - new Date(seen).getTime() < 45000; return { id: Number(row.id), username: row.username, displayName: row.display_name || row.username, avatarUrl: row.avatar_url ?? null, bio: row.bio ?? null, isOnline: fresh, lastSeen: seen, createdAt: row.created_at, messageSearchOnly: !!row.message_search_only }; }'
          if old in s: s = s.replace(old, new)
          else:
            old = 'function publicUser(row: any, online = false) { const seen = row.last_seen_at || row.updated_at || row.created_at; const fresh = Date.now() - new Date(seen).getTime() < 45000; return { id: Number(row.id), username: row.username, displayName: row.display_name || row.username, avatarUrl: row.avatar_url ?? null, bio: row.bio ?? null, isOnline: fresh, lastSeen: seen, createdAt: row.created_at }; }'
            if old in s: s = s.replace(old, new)

          old = 'async function ensureExtraTables(env: Env) { await env.DB.batch([env.DB.prepare(`CREATE TABLE IF NOT EXISTS message_reactions (message_id TEXT NOT NULL,user_id TEXT NOT NULL,emoji TEXT NOT NULL,PRIMARY KEY (message_id,user_id,emoji))`), env.DB.prepare(`CREATE TABLE IF NOT EXISTS typing_indicators (conversation_id TEXT NOT NULL,user_id TEXT NOT NULL,updated_at TEXT NOT NULL,PRIMARY KEY (conversation_id,user_id))`)]); }'
          new = 'async function ensureExtraTables(env: Env) { const columns = await env.DB.prepare(`PRAGMA table_info(users)`).all<any>(); if (!columns.results.some((c: any) => c.name === "message_search_only")) await env.DB.prepare(`ALTER TABLE users ADD COLUMN message_search_only INTEGER NOT NULL DEFAULT 0`).run(); await env.DB.batch([env.DB.prepare(`CREATE TABLE IF NOT EXISTS message_reactions (message_id TEXT NOT NULL,user_id TEXT NOT NULL,emoji TEXT NOT NULL,PRIMARY KEY (message_id,user_id,emoji))`), env.DB.prepare(`CREATE TABLE IF NOT EXISTS typing_indicators (conversation_id TEXT NOT NULL,user_id TEXT NOT NULL,updated_at TEXT NOT NULL,PRIMARY KEY (conversation_id,user_id))`), env.DB.prepare(`CREATE TABLE IF NOT EXISTS message_search_grants (searcher_id TEXT NOT NULL,target_user_id TEXT NOT NULL,expires_at TEXT NOT NULL,PRIMARY KEY (searcher_id,target_user_id))`)]); }'
          if old in s: s = s.replace(old, new)

          old = 'if (path === "/api/users" && request.method === "GET") { const search = (url.searchParams.get("search") || "").trim(); const rows = search ? await env.DB.prepare(`SELECT * FROM users WHERE (lower(username) LIKE lower(?) OR lower(display_name) LIKE lower(?)) ORDER BY username LIMIT 20`).bind(`%${search}%`, `%${search}%`).all<any>() : await env.DB.prepare(`SELECT * FROM users ORDER BY username LIMIT 30`).all<any>(); return json(rows.results.map((u: any) => publicUser(u)), 200, request, env); }'
          new = 'if (path === "/api/users" && request.method === "GET") { const search = (url.searchParams.get("search") || "").trim(); const rows = search ? await env.DB.prepare(`SELECT * FROM users WHERE (lower(username) LIKE lower(?) OR lower(display_name) LIKE lower(?)) ORDER BY username LIMIT 20`).bind(`%${search}%`, `%${search}%`).all<any>() : await env.DB.prepare(`SELECT * FROM users ORDER BY username LIMIT 30`).all<any>(); if (search) { const exact = await env.DB.prepare(`SELECT id FROM users WHERE lower(username) = lower(?) LIMIT 1`).bind(search).first<any>(); if (exact && String(exact.id) !== String(me.id)) await env.DB.prepare(`INSERT OR REPLACE INTO message_search_grants (searcher_id,target_user_id,expires_at) VALUES (?,?,?)`).bind(me.id, exact.id, new Date(Date.now() + 10 * 60 * 1000).toISOString()).run(); } return json(rows.results.map((u: any) => publicUser(u)), 200, request, env); }'
          if old in s: s = s.replace(old, new)

          old = 'if (path === "/api/users/me" && request.method === "PATCH") { const body = await parseBody(request); const displayName = body.displayName !== undefined ? String(body.displayName).trim() : me.display_name; const bio = body.bio !== undefined ? String(body.bio).trim().slice(0, 200) : (me.bio ?? null); const avatarUrl = body.avatarUrl !== undefined ? String(body.avatarUrl) : me.avatar_url; if (avatarUrl && avatarUrl.length > 1200000) return error("Avatar image is too large", 400, request, env); await env.DB.prepare(`UPDATE users SET display_name = ?, avatar_url = ?, bio = ?, updated_at = ? WHERE id = ?`).bind(displayName, avatarUrl, bio, new Date().toISOString(), me.id).run(); const updated = await env.DB.prepare(`SELECT * FROM users WHERE id = ?`).bind(me.id).first<any>(); return json(publicUser(updated, true), 200, request, env); }'
          new = 'if (path === "/api/users/me" && request.method === "PATCH") { const body = await parseBody(request); const displayName = body.displayName !== undefined ? String(body.displayName).trim() : me.display_name; const bio = body.bio !== undefined ? String(body.bio).trim().slice(0, 200) : (me.bio ?? null); const avatarUrl = body.avatarUrl !== undefined ? String(body.avatarUrl) : me.avatar_url; const messageSearchOnly = body.messageSearchOnly !== undefined ? (body.messageSearchOnly ? 1 : 0) : Number(me.message_search_only || 0); if (avatarUrl && avatarUrl.length > 1200000) return error("Avatar image is too large", 400, request, env); await env.DB.prepare(`UPDATE users SET display_name = ?, avatar_url = ?, bio = ?, message_search_only = ?, updated_at = ? WHERE id = ?`).bind(displayName, avatarUrl, bio, messageSearchOnly, new Date().toISOString(), me.id).run(); const updated = await env.DB.prepare(`SELECT * FROM users WHERE id = ?`).bind(me.id).first<any>(); return json(publicUser(updated, true), 200, request, env); }'
          if old in s: s = s.replace(old, new)

          old = 'if (path === "/api/conversations" && request.method === "POST") { const body = await parseBody(request); const participantId = String(body.participantId || ""); const participant = await env.DB.prepare(`SELECT id FROM users WHERE id = ? OR CAST(id AS REAL) = ? LIMIT 1`).bind(participantId, Number(participantId)).first<any>(); if (!participant) return error("Invalid participant", 400, request, env); const resolvedParticipantId = String(participant.id); const existing = await env.DB.prepare(`SELECT a.conversation_id FROM conversation_members a JOIN conversation_members b ON a.conversation_id = b.conversation_id WHERE a.user_id = ? AND b.user_id = ? LIMIT 1`).bind(me.id, resolvedParticipantId).first<any>(); let convId = existing?.conversation_id; if (!convId) { convId = id(); const now = new Date().toISOString(); await env.DB.batch([env.DB.prepare(`INSERT INTO conversations (id, created_at, updated_at) VALUES (?, ?, ?)`).bind(convId, now, now), env.DB.prepare(`INSERT INTO conversation_members (conversation_id, user_id) VALUES (?, ?), (?, ?)`).bind(convId, me.id, convId, resolvedParticipantId)]); } return json(await conversationObject(env, convId, me.id), 201, request, env); }'
          new = 'if (path === "/api/conversations" && request.method === "POST") { const body = await parseBody(request); const participantId = String(body.participantId || ""); const participant = await env.DB.prepare(`SELECT * FROM users WHERE id = ? OR CAST(id AS REAL) = ? LIMIT 1`).bind(participantId, Number(participantId)).first<any>(); if (!participant) return error("Invalid participant", 400, request, env); const resolvedParticipantId = String(participant.id); const existing = await env.DB.prepare(`SELECT a.conversation_id FROM conversation_members a JOIN conversation_members b ON a.conversation_id = b.conversation_id WHERE a.user_id = ? AND b.user_id = ? LIMIT 1`).bind(me.id, resolvedParticipantId).first<any>(); let convId = existing?.conversation_id; if (!convId && participant.message_search_only) { const grant = await env.DB.prepare(`SELECT 1 FROM message_search_grants WHERE searcher_id = ? AND target_user_id = ? AND expires_at > ? LIMIT 1`).bind(me.id, resolvedParticipantId, new Date().toISOString()).first<any>(); if (!grant) return error("This user only accepts new messages after you search their exact username.", 403, request, env); } if (!convId) { convId = id(); const now = new Date().toISOString(); await env.DB.batch([env.DB.prepare(`INSERT INTO conversations (id, created_at, updated_at) VALUES (?, ?, ?)`).bind(convId, now, now), env.DB.prepare(`INSERT INTO conversation_members (conversation_id, user_id) VALUES (?, ?), (?, ?)`).bind(convId, me.id, convId, resolvedParticipantId)]); } return json(await conversationObject(env, convId, me.id), 201, request, env); }'
          if old in s: s = s.replace(old, new)

          p.write_text(s)
      - name: Commit backend patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-worker/src/index.ts
          git diff --cached --quiet || git commit -m 'Add search-only messaging privacy'
          git push
