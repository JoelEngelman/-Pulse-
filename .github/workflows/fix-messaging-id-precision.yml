name: Fix messaging ID precision

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Worker participant lookup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('cloudflare-worker/src/index.ts')
          s = p.read_text()
          old = 'const body = await parseBody(request); const participantId = String(body.participantId || ""); const participant = await env.DB.prepare(`SELECT id FROM users WHERE id = ?`).bind(participantId).first(); if (!participant) return error("Invalid participant", 400, request, env); const existing = await env.DB.prepare(`SELECT a.conversation_id FROM conversation_members a JOIN conversation_members b ON a.conversation_id = b.conversation_id WHERE a.user_id = ? AND b.user_id = ? LIMIT 1`).bind(me.id, participantId).first<any>();'
          new = 'const body = await parseBody(request); const participantId = String(body.participantId || ""); const participant = await env.DB.prepare(`SELECT id FROM users WHERE id = ? OR CAST(id AS REAL) = ? LIMIT 1`).bind(participantId, Number(participantId)).first<any>(); if (!participant) return error("Invalid participant", 400, request, env); const resolvedParticipantId = String(participant.id); const existing = await env.DB.prepare(`SELECT a.conversation_id FROM conversation_members a JOIN conversation_members b ON a.conversation_id = b.conversation_id WHERE a.user_id = ? AND b.user_id = ? LIMIT 1`).bind(me.id, resolvedParticipantId).first<any>();'
          if old in s:
              p.write_text(s.replace(old, new))
              print('patched')
          elif 'CAST(id AS REAL) = ?' in s and 'resolvedParticipantId' in s:
              print('already patched')
          else:
              raise SystemExit('conversation participant lookup pattern not found')
          PY

      - name: Ensure conversation member uses resolved ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('cloudflare-worker/src/index.ts')
          s = p.read_text()
          old = 'env.DB.prepare(`INSERT INTO conversation_members (conversation_id, user_id) VALUES (?, ?), (?, ?)`).bind(convId, me.id, convId, participantId)'
          new = 'env.DB.prepare(`INSERT INTO conversation_members (conversation_id, user_id) VALUES (?, ?), (?, ?)`).bind(convId, me.id, convId, resolvedParticipantId)'
          if old in s:
              p.write_text(s.replace(old, new))
              print('patched member insert')
          elif 'convId, resolvedParticipantId)' in s:
              print('member insert already patched')
          else:
              raise SystemExit('conversation member insert pattern not found')
          PY

      - name: Commit Worker fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-worker/src/index.ts
          if git diff --cached --quiet; then
            echo "No Worker changes to commit."
            exit 0
          fi
          git commit -m "Fix messaging participant ID precision"
          git push origin main
