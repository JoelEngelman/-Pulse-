name: Fix self messaging

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Allow self messaging') }}
    runs-on: ubuntu-latest
    steps:
      - name: Patch Worker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          python3 - <<'PY'
          from pathlib import Path
          p = Path('cloudflare-worker/src/index.ts')
          s = p.read_text()
          old1 = 'if (!participant || participantId === String(me.id)) return error("Invalid participant", 400, request, env);'
          new1 = 'if (!participant) return error("Invalid participant", 400, request, env);'
          old2 = 'const search = (url.searchParams.get("search") || "").trim(); const rows = search ? await env.DB.prepare(`SELECT * FROM users WHERE id != ? AND (lower(username) LIKE lower(?) OR lower(display_name) LIKE lower(?)) ORDER BY username LIMIT 20`).bind(me.id, `%${search}%`, `%${search}%`).all<any>() : await env.DB.prepare(`SELECT * FROM users WHERE id != ? ORDER BY username LIMIT 30`).bind(me.id).all<any>();'
          new2 = 'const search = (url.searchParams.get("search") || "").trim(); const rows = search ? await env.DB.prepare(`SELECT * FROM users WHERE (lower(username) LIKE lower(?) OR lower(display_name) LIKE lower(?)) ORDER BY username LIMIT 20`).bind(`%${search}%`, `%${search}%`).all<any>() : await env.DB.prepare(`SELECT * FROM users ORDER BY username LIMIT 30`).all<any>();'
          if old1 not in s:
              raise SystemExit('self-message guard not found')
          if old2 not in s:
              raise SystemExit('users query not found')
          p.write_text(s.replace(old1, new1).replace(old2, new2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-worker/src/index.ts
          git commit -m "Allow self messaging"
          git push origin main
