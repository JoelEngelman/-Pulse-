name: Upgrade Pulse Social

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    if: ${{ !contains(github.event.head_commit.message, 'Apply Pulse Social media upgrade') }}
    runs-on: ubuntu-latest
    steps:
      - name: Patch Pulse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          python3 - <<'PY'
          from pathlib import Path
          import re

          # ---------- Backend ----------
          p = Path('cloudflare-worker/src/index.ts')
          s = p.read_text()

          old_post = re.search(r'async function postObject\(env: Env, row: any, me: string\) \{.*?\n\}\n\nexport default', s, re.S)
          if not old_post:
              raise SystemExit('postObject block not found')
          new_post = r'''async function postObject(env: Env, row: any, me: string) {
  const user = await env.DB.prepare(`SELECT * FROM users WHERE id = ? LIMIT 1`).bind(row.user_id).first<any>();
  const likes = await env.DB.prepare(`SELECT COUNT(*) AS count FROM post_likes WHERE post_id = ?`).bind(row.id).first<any>();
  const comments = await env.DB.prepare(`SELECT COUNT(*) AS count FROM post_comments WHERE post_id = ?`).bind(row.id).first<any>();
  const liked = await env.DB.prepare(`SELECT 1 FROM post_likes WHERE post_id = ? AND user_id = ? LIMIT 1`).bind(row.id, me).first<any>();
  const following = user && String(user.id) !== String(me) ? await env.DB.prepare(`SELECT 1 FROM follows WHERE follower_id = ? AND following_id = ? LIMIT 1`).bind(me, user.id).first<any>() : null;
  let repostOf: any = null;
  const repostMatch = String(row.content || '').match(/^\[PULSE_REPOST:([^\]]+)\](?:\n|\s)*(.*)$/s);
  if (repostMatch) {
    const original = await env.DB.prepare(`SELECT * FROM posts WHERE id = ? LIMIT 1`).bind(repostMatch[1]).first<any>();
    if (original) {
      const originalUser = await env.DB.prepare(`SELECT * FROM users WHERE id = ? LIMIT 1`).bind(original.user_id).first<any>();
      repostOf = { id: String(original.id), content: original.content, createdAt: original.created_at, user: originalUser ? publicUser(originalUser) : null, image: original.image_url || null, filter: original.filter || 'Normal', music: original.music_url ? { title: original.music_title, artist: original.music_artist, previewUrl: original.music_url } : null };
    }
  }
  const media = (row.image_url || row.music_url || row.filter) ? {
    image: row.image_url || null,
    filter: row.filter || 'Normal',
    music: row.music_url ? { title: row.music_title || 'Unknown track', artist: row.music_artist || '', previewUrl: row.music_url } : null
  } : null;
  return { id: String(row.id), content: repostMatch ? (repostMatch[2] || '') : row.content, createdAt: row.created_at, user: user ? publicUser(user) : null, likeCount: Number(likes?.count || 0), commentCount: Number(comments?.count || 0), liked: !!liked, following: !!following, media, repostOf };
}

export default'''
          s = s[:old_post.start()] + new_post + s[old_post.end():]

          old_feed = re.search(r'      if \(path === "/api/feed" && request\.method === "GET"\) \{.*?\n      \}\n\n      if \(path === "/api/posts"', s, re.S)
          if not old_feed:
              raise SystemExit('feed route not found')
          new_feed = r'''      if (path === "/api/feed" && request.method === "GET") {
        const mode = url.searchParams.get("mode") || "for-you";
        let rows;
        if (mode === "following") {
          rows = await env.DB.prepare(`SELECT p.* FROM posts p WHERE p.user_id = ? OR p.user_id IN (SELECT following_id FROM follows WHERE follower_id = ?) ORDER BY p.created_at DESC LIMIT 50`).bind(me.id, me.id).all<any>();
        } else if (mode === "popular") {
          rows = await env.DB.prepare(`SELECT p.*, (SELECT COUNT(*) FROM post_likes l WHERE l.post_id = p.id) AS like_score, (SELECT COUNT(*) FROM post_comments c WHERE c.post_id = p.id) AS comment_score FROM posts p ORDER BY like_score DESC, comment_score DESC, p.created_at DESC LIMIT 50`).all<any>();
        } else {
          rows = await env.DB.prepare(`SELECT p.* FROM posts p ORDER BY p.created_at DESC LIMIT 50`).all<any>();
        }
        const result = await Promise.all(rows.results.map((row: any) => postObject(env, row, String(me.id))));
        return json(result, 200, request, env);
      }

      if (path === "/api/posts"'''
          s = s[:old_feed.start()] + new_feed + s[old_feed.end():]

          old_create = re.search(r'      if \(path === "/api/posts" && request\.method === "POST"\) \{.*?\n      \}\n\n      const postLikeMatch', s, re.S)
          if not old_create:
              raise SystemExit('post create route not found')
          new_create = r'''      if (path === "/api/posts" && request.method === "POST") {
        const body = await parseBody(request);
        const content = String(body.content || "").trim();
        const imageUrl = body.imageUrl ? String(body.imageUrl) : null;
        const musicUrl = body.musicUrl ? String(body.musicUrl) : null;
        const musicTitle = body.musicTitle ? String(body.musicTitle).slice(0, 200) : null;
        const musicArtist = body.musicArtist ? String(body.musicArtist).slice(0, 200) : null;
        const filter = body.filter ? String(body.filter).slice(0, 80) : null;
        if (!content && !imageUrl && !musicUrl) return error("Post cannot be empty", 400, request, env);
        if (content.length > 500) return error("Post text is limited to 500 characters", 400, request, env);
        if (imageUrl && imageUrl.length > 1200000) return error("That photo is too large. Please choose a smaller image.", 400, request, env);
        if (imageUrl && !/^data:image\/(jpeg|jpg|png|webp|gif);base64,/i.test(imageUrl)) return error("Invalid image", 400, request, env);
        const postId = id(); const now = new Date().toISOString();
        await env.DB.prepare(`INSERT INTO posts (id, user_id, content, image_url, music_url, music_title, music_artist, filter, created_at, updated_at) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?)`).bind(postId, me.id, content, imageUrl, musicUrl, musicTitle, musicArtist, filter, now, now).run();
        const post = await env.DB.prepare(`SELECT * FROM posts WHERE id = ?`).bind(postId).first<any>();
        return json(await postObject(env, post, String(me.id)), 201, request, env);
      }

      const repostMatch = path.match(/^\/api\/posts\/([^/]+)\/repost$/);
      if (repostMatch && request.method === "POST") {
        const originalId = repostMatch[1];
        const original = await env.DB.prepare(`SELECT id FROM posts WHERE id = ? LIMIT 1`).bind(originalId).first<any>();
        if (!original) return error("Post not found", 404, request, env);
        const body = await parseBody(request); const caption = String(body.caption || "").trim().slice(0, 500);
        const postId = id(); const now = new Date().toISOString();
        await env.DB.prepare(`INSERT INTO posts (id, user_id, content, created_at, updated_at) VALUES (?, ?, ?, ?, ?)`).bind(postId, me.id, `[PULSE_REPOST:${originalId}]${caption ? `\\n${caption}` : ''}`, now, now).run();
        const post = await env.DB.prepare(`SELECT * FROM posts WHERE id = ?`).bind(postId).first<any>();
        return json(await postObject(env, post, String(me.id)), 201, request, env);
      }

      const postLikeMatch'''
          s = s[:old_create.start()] + new_create + s[old_create.end():]

          p.write_text(s)

